events {}
http {
  log_format canary '$remote_addr "$request" $status $upstream_response_time $upstream_addr';
  access_log /var/log/nginx/access.log canary;
  upstream stable { server stable:5000; }
  upstream canary { server canary:5000; }
  # weights.conf defines split_clients -> $target_pool ("stable" or "canary")
  include /etc/nginx/conf.d/weights.conf;

  server {
    listen 80;
    location / {
      proxy_pass http://$target_pool;
      add_header X-Served-By $target_pool always;
    }
  }
}
