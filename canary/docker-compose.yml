# Canary: stable (v1) takes most traffic, canary (v2) takes a small weighted slice.
services:
  stable:
    build: ../app
    environment: {APP_VERSION: "1.0.0", APP_COLOR: stable, API_TOKEN: "${API_TOKEN}"}
  canary:
    build: ../app
    environment: {APP_VERSION: "2.0.0", APP_COLOR: canary, API_TOKEN: "${API_TOKEN}", FAIL_RATE: "${CANARY_FAIL_RATE:-0}"}
  router:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./weights.conf:/etc/nginx/conf.d/weights.conf
    depends_on: [stable, canary]
