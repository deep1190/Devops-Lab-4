apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: lab4
spec:
  replicas: 3
  selector:
    matchLabels: {app: notes-app}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: notes-app}
    spec:
      containers:
        - name: app
          image: ghcr.io/deep1190/lab4-notes-app:0fb5280d91504e2370a65a51e3be2e71fc7de08b
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "1.0.0"}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: notes-app-secrets, key: api-token}   # synced from Vault, never in Git
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 10
