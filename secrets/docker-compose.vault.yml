# HashiCorp Vault in DEV mode (in-memory, auto-unsealed) - for the lab only, never for production.
services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token      # dev-only token, not a real secret
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
