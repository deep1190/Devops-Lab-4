events {}
http {
  upstream blue  { server app-blue:5000; }
  upstream green { server app-green:5000; }
  include /etc/nginx/conf.d/active.conf;   # defines: map $host $active_env { default blue; }

  server {
    listen 80;
    location / {
      proxy_pass http://$active_env;
      add_header X-Served-By $active_env always;
    }
  }
}
