# Blue-Green: two identical environments behind one nginx router.
# Only ONE is live at a time; switching = change the upstream + `nginx -s reload` (graceful, no dropped connections).
services:
  app-blue:
    build: ../app
    environment:
      APP_VERSION: ${BLUE_VERSION:-1.0.0}
      APP_COLOR: blue
      API_TOKEN: ${API_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 3
  app-green:
    build: ../app
    environment:
      APP_VERSION: ${GREEN_VERSION:-2.0.0}
      APP_COLOR: green
      API_TOKEN: ${API_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 3
  router:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./active.conf:/etc/nginx/conf.d/active.conf   # switch.sh rewrites this file
    depends_on:
      app-blue: {condition: service_healthy}
      app-green: {condition: service_healthy}
